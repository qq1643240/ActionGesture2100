name: Build tweak

on:
  push:
  pull_request:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang lld llvm make git perl fakeroot dpkg-dev
      - name: Install ldid
        shell: bash
        run: |
          mkdir -p "$HOME/bin"
          curl -L --fail --retry 3 \
            -o "$HOME/bin/ldid" \
            https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_linux_x86_64
          chmod +x "$HOME/bin/ldid"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Install Theos and SDK
        shell: bash
        run: |
          git clone --recursive --depth 1 https://github.com/roothide/theos.git "$HOME/theos"
          git clone --depth 1 https://github.com/theos/sdks.git "$RUNNER_TEMP/sdks"
          cp -R "$RUNNER_TEMP"/sdks/*.sdk "$HOME/theos/sdks/"
      - name: Build Relaxin roothide arm64e package
        env:
          THEOS: ${{ github.workspace }}/.theos
        run: |
          ln -s "$HOME/theos" "$THEOS"
          mkdir -p "$THEOS/toolchain/linux/iphone/bin"
          rm -f "$THEOS/toolchain/linux/iphone/bin/clang" "$THEOS/toolchain/linux/iphone/bin/clang++"
          ln -sf "$(command -v ld.lld)" "$THEOS/toolchain/linux/iphone/bin/ld.llvm"
          ln -sf "$(command -v llvm-strip)" "$THEOS/toolchain/linux/iphone/bin/strip"
          cat > "$RUNNER_TEMP/theos-clang-wrapper" <<'EOF'
          #!/usr/bin/env bash
          args=()
          for arg in "$@"; do
            if [[ "$arg" == "-fuse-ld=llvm" ]]; then
              args+=("-fuse-ld=lld")
            else
              args+=("$arg")
            fi
          done
          exec "${CLANG_REAL}" "${args[@]}"
          EOF
          chmod +x "$RUNNER_TEMP/theos-clang-wrapper"
          sed "s#\${CLANG_REAL}#/usr/bin/clang#" "$RUNNER_TEMP/theos-clang-wrapper" > "$THEOS/toolchain/linux/iphone/bin/clang"
          sed "s#\${CLANG_REAL}#/usr/bin/clang++#" "$RUNNER_TEMP/theos-clang-wrapper" > "$THEOS/toolchain/linux/iphone/bin/clang++"
          chmod +x "$THEOS/toolchain/linux/iphone/bin/clang" "$THEOS/toolchain/linux/iphone/bin/clang++"
          export PATH="$THEOS/toolchain/linux/iphone/bin:$PATH"
          make package SCHEME=roothide FINALPACKAGE=1
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ActionGesture2100-roothide-arm64e
          path: packages/*arm64e*.deb
