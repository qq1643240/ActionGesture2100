name: Build tweak

on:
  push:
  pull_request:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang make git perl fakeroot dpkg-dev
      - name: Install Theos and SDK
        shell: bash
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          git clone --depth 1 https://github.com/theos/sdks.git "$RUNNER_TEMP/sdks"
          cp -R "$RUNNER_TEMP"/sdks/*.sdk "$HOME/theos/sdks/"
      - name: Build rootless package
        env:
          THEOS: ${{ github.workspace }}/.theos
        run: |
          ln -s "$HOME/theos" "$THEOS"
          make package SCHEME=rootless FINALPACKAGE=1
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ActionGesture2100-rootless
          path: packages/*.deb
