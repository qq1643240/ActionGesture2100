name: Build tweak

on:
  push:
  pull_request:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang lld make git perl fakeroot dpkg-dev
      - name: Install Theos and SDK
        shell: bash
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          git clone --depth 1 https://github.com/theos/sdks.git "$RUNNER_TEMP/sdks"
          cp -R "$RUNNER_TEMP"/sdks/*.sdk "$HOME/theos/sdks/"
      - name: Build rootless package
        env:
          THEOS: ${{ github.workspace }}/.theos
        run: |
          ln -s "$HOME/theos" "$THEOS"
          mkdir -p "$THEOS/toolchain/linux/iphone/bin"
          ln -sf "$(command -v clang)" "$THEOS/toolchain/linux/iphone/bin/clang"
          ln -sf "$(command -v clang++)" "$THEOS/toolchain/linux/iphone/bin/clang++"
          ln -sf "$(command -v ld.lld)" "$THEOS/toolchain/linux/iphone/bin/ld.llvm"
          cat > "$RUNNER_TEMP/theos-clang-wrapper" <<'EOF'
          #!/usr/bin/env bash
          args=()
          for arg in "$@"; do
            if [[ "$arg" == "-fuse-ld=llvm" ]]; then
              args+=("-fuse-ld=lld")
            else
              args+=("$arg")
            fi
          done
          exec "${CLANG_REAL}" "${args[@]}"
          EOF
          chmod +x "$RUNNER_TEMP/theos-clang-wrapper"
          sed "s#\${CLANG_REAL}#/usr/bin/clang#" "$RUNNER_TEMP/theos-clang-wrapper" > "$THEOS/toolchain/linux/iphone/bin/clang"
          sed "s#\${CLANG_REAL}#/usr/bin/clang++#" "$RUNNER_TEMP/theos-clang-wrapper" > "$THEOS/toolchain/linux/iphone/bin/clang++"
          chmod +x "$THEOS/toolchain/linux/iphone/bin/clang" "$THEOS/toolchain/linux/iphone/bin/clang++"
          export PATH="$THEOS/toolchain/linux/iphone/bin:$PATH"
          make package SCHEME=rootless FINALPACKAGE=1
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ActionGesture2100-rootless
          path: packages/*.deb
